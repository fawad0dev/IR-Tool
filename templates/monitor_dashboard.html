<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IR-Tool: Live Monitoring Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 28px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-text {
            color: #4ade80;
            font-weight: bold;
        }
        
        .last-update {
            color: #666;
            font-size: 14px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .card h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .metric:last-child {
            border-bottom: none;
        }
        
        .metric-label {
            color: #666;
            font-weight: 500;
        }
        
        .metric-value {
            color: #333;
            font-weight: bold;
        }
        
        .progress-bar {
            width: 100%;
            height: 24px;
            background: #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        
        .progress-fill.warning {
            background: linear-gradient(90deg, #f59e0b 0%, #f97316 100%);
        }
        
        .progress-fill.danger {
            background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%);
        }
        
        .table-container {
            overflow-x: auto;
            margin-top: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        th {
            background: #f8f9fa;
            color: #667eea;
            padding: 10px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .alert {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .alert h3 {
            color: #dc2626;
            margin-bottom: 10px;
        }
        
        .alert-item {
            padding: 5px 0;
            color: #991b1b;
        }
        
        .changes {
            background: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .changes h3 {
            color: #16a34a;
            margin-bottom: 10px;
        }
        
        .change-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .badge-new {
            background: #dcfce7;
            color: #16a34a;
        }
        
        .badge-terminated {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🛡️ IR-Tool: Live Monitoring Dashboard</h1>
                <p class="last-update">Last Update: <span id="lastUpdate">Never</span></p>
            </div>
            <div class="status">
                <div class="status-indicator"></div>
                <span class="status-text">LIVE</span>
            </div>
        </div>
        
        <div id="content">
            <div class="card">
                <h2>Loading...</h2>
                <p>Waiting for monitoring data...</p>
            </div>
        </div>
    </div>
    
    <script>
        let updateCount = 0;
        
        function formatBytes(bytes) {
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let value = bytes;
            let unitIndex = 0;
            
            while (value >= 1024 && unitIndex < units.length - 1) {
                value /= 1024;
                unitIndex++;
            }
            
            return `${value.toFixed(2)} ${units[unitIndex]}`;
        }
        
        function getProgressClass(percent) {
            if (percent >= 80) return 'danger';
            if (percent >= 60) return 'warning';
            return '';
        }
        
        function renderSystemInfo(system) {
            return `
                <div class="card">
                    <h2>📊 System Overview</h2>
                    <div class="metric">
                        <span class="metric-label">Hostname</span>
                        <span class="metric-value">${system.hostname || 'N/A'}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Platform</span>
                        <span class="metric-value">${system.platform || 'N/A'} ${system.platform_release || ''}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">CPU Count</span>
                        <span class="metric-value">${system.cpu_count || 'N/A'}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">CPU Usage</span>
                        <span class="metric-value">${system.cpu_percent?.toFixed(1) || '0'}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill ${getProgressClass(system.cpu_percent)}" style="width: ${system.cpu_percent || 0}%">
                            ${system.cpu_percent?.toFixed(1) || '0'}%
                        </div>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Memory Usage</span>
                        <span class="metric-value">${system.memory_percent?.toFixed(1) || '0'}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill ${getProgressClass(system.memory_percent)}" style="width: ${system.memory_percent || 0}%">
                            ${system.memory_percent?.toFixed(1) || '0'}%
                        </div>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Memory Total</span>
                        <span class="metric-value">${formatBytes(system.memory_total || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Memory Available</span>
                        <span class="metric-value">${formatBytes(system.memory_available || 0)}</span>
                    </div>
                </div>
            `;
        }
        
        function renderTopProcesses(processes) {
            if (!processes || processes.length === 0) {
                return '<div class="card"><h2>🔄 Top Processes</h2><p>No processes data available</p></div>';
            }
            
            const topProcesses = processes
                .sort((a, b) => (b.cpu_percent || 0) - (a.cpu_percent || 0))
                .slice(0, 10);
            
            const rows = topProcesses.map(proc => `
                <tr>
                    <td>${proc.pid || 'N/A'}</td>
                    <td>${proc.name || 'N/A'}</td>
                    <td>${proc.username || 'N/A'}</td>
                    <td>${proc.cpu_percent?.toFixed(1) || '0'}%</td>
                    <td>${proc.memory_percent?.toFixed(2) || '0'}%</td>
                    <td>${proc.status || 'N/A'}</td>
                </tr>
            `).join('');
            
            return `
                <div class="card">
                    <h2>🔄 Top CPU Processes</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>PID</th>
                                    <th>Name</th>
                                    <th>User</th>
                                    <th>CPU %</th>
                                    <th>Memory %</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        
        function renderNetworkConnections(network) {
            if (!network || !network.connections || network.connections.length === 0) {
                return '<div class="card"><h2>🌐 Network Connections</h2><p>No network connections available</p></div>';
            }
            
            const connections = network.connections
                .filter(conn => !conn.error)
                .slice(0, 15);
            
            const rows = connections.map(conn => `
                <tr>
                    <td>${conn.local_addr || 'N/A'}</td>
                    <td>${conn.remote_addr || 'N/A'}</td>
                    <td>${conn.status || 'N/A'}</td>
                    <td>${conn.pid || 'N/A'}</td>
                </tr>
            `).join('');
            
            return `
                <div class="card">
                    <h2>🌐 Network Connections (Top 15)</h2>
                    <div class="metric">
                        <span class="metric-label">Total Active Connections</span>
                        <span class="metric-value">${network.connections.filter(c => !c.error).length}</span>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Local Address</th>
                                    <th>Remote Address</th>
                                    <th>Status</th>
                                    <th>PID</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        
        function renderDiskInfo(disk) {
            if (!disk || !disk.partitions || disk.partitions.length === 0) {
                return '<div class="card"><h2>💾 Disk Usage</h2><p>No disk data available</p></div>';
            }
            
            const rows = disk.partitions.map(part => `
                <tr>
                    <td>${part.device || 'N/A'}</td>
                    <td>${part.mountpoint || 'N/A'}</td>
                    <td>${formatBytes(part.total || 0)}</td>
                    <td>${formatBytes(part.used || 0)}</td>
                    <td>${formatBytes(part.free || 0)}</td>
                    <td>${part.percent?.toFixed(1) || '0'}%</td>
                </tr>
            `).join('');
            
            return `
                <div class="card">
                    <h2>💾 Disk Usage</h2>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Device</th>
                                    <th>Mount Point</th>
                                    <th>Total</th>
                                    <th>Used</th>
                                    <th>Free</th>
                                    <th>Usage %</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        
        function renderAlerts(data) {
            const alerts = [];
            
            // Check for high CPU processes
            if (data.processes) {
                const highCpu = data.processes.filter(p => p.cpu_percent > 70);
                highCpu.forEach(proc => {
                    alerts.push(`High CPU: ${proc.name} (PID: ${proc.pid}) - ${proc.cpu_percent.toFixed(1)}%`);
                });
                
                const highMemory = data.processes.filter(p => p.memory_percent > 70);
                highMemory.forEach(proc => {
                    alerts.push(`High Memory: ${proc.name} (PID: ${proc.pid}) - ${proc.memory_percent.toFixed(1)}%`);
                });
            }
            
            if (alerts.length === 0) return '';
            
            return `
                <div class="alert">
                    <h3>⚠️ Resource Alerts</h3>
                    ${alerts.slice(0, 5).map(alert => `<div class="alert-item">${alert}</div>`).join('')}
                </div>
            `;
        }
        
        function renderChanges(changes) {
            if (!changes || changes.message) return '';
            
            const items = [];
            
            if (changes.new_process_count > 0) {
                items.push(`<span class="change-badge badge-new">+${changes.new_process_count} New Processes</span>`);
            }
            if (changes.terminated_process_count > 0) {
                items.push(`<span class="change-badge badge-terminated">-${changes.terminated_process_count} Terminated</span>`);
            }
            if (changes.new_connection_count > 0) {
                items.push(`<span class="change-badge badge-new">+${changes.new_connection_count} New Connections</span>`);
            }
            if (changes.closed_connection_count > 0) {
                items.push(`<span class="change-badge badge-terminated">-${changes.closed_connection_count} Closed Connections</span>`);
            }
            
            if (items.length === 0) return '';
            
            let newProcessList = '';
            if (changes.new_processes && changes.new_processes.length > 0) {
                newProcessList = '<div style="margin-top: 10px;"><strong>New Processes:</strong><ul style="margin-left: 20px; margin-top: 5px;">' +
                    changes.new_processes.slice(0, 5).map(p => `<li>${p.name} (PID: ${p.pid})</li>`).join('') +
                    '</ul></div>';
            }
            
            return `
                <div class="changes">
                    <h3>🔄 Changes Detected</h3>
                    <div>${items.join(' ')}</div>
                    ${newProcessList}
                </div>
            `;
        }
        
        function updateDashboard() {
            fetch('monitor_data.json?t=' + Date.now())
                .then(response => {
                    if (!response.ok) throw new Error('Failed to fetch data');
                    return response.json();
                })
                .then(data => {
                    updateCount++;
                    document.getElementById('lastUpdate').textContent = new Date(data.timestamp).toLocaleString();
                    
                    const contentDiv = document.getElementById('content');
                    contentDiv.innerHTML = `
                        ${renderAlerts(data)}
                        ${renderChanges(data.changes)}
                        <div class="grid">
                            ${renderSystemInfo(data.system || {})}
                            ${renderTopProcesses(data.processes || [])}
                        </div>
                        <div class="grid">
                            ${renderNetworkConnections(data.network || {})}
                            ${renderDiskInfo(data.disk || {})}
                        </div>
                    `;
                })
                .catch(error => {
                    if (updateCount === 0) {
                        document.getElementById('content').innerHTML = `
                            <div class="card">
                                <h2>Waiting for data...</h2>
                                <p>The monitoring session is starting. Data will appear shortly.</p>
                            </div>
                        `;
                    }
                });
        }
        
        // Initial update
        updateDashboard();
        
        // Update every 2 seconds
        setInterval(updateDashboard, 2000);
    </script>
</body>
</html>
